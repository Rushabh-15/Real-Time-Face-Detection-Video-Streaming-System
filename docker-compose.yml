# docker-compose.yml — full face-detect-stream stack
#
# One-command run:
#   cp .env.example .env && docker compose up --build
# Then visit http://localhost:5173 and grant webcam permission.
#
# Targets Compose v2+ (no `version:` key needed).

services:
  postgres:
    image: postgres:16-alpine
    container_name: face-detect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No host ports exposed by default — backend reaches Postgres via the
    # docker network. For host-side `psql` / GUI inspection, uncomment:
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face-detect-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Run migrations to head, then `exec` into uvicorn so it owns PID 1 and
    # SIGTERM lands directly (clean shutdown, no 10s container-stop timeout).
    # `&&` (not `;`) so a failed migration aborts boot loud rather than
    # starting uvicorn against a stale schema. Inline migration on boot is
    # a deliberate single-replica simplification — for multi-replica you'd
    # factor this into a one-shot init service.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-slim
    container_name: face-detect-frontend
    working_dir: /app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./frontend:/app
      # Named volume sits "on top" of the bind mount and preserves the
      # container's Linux-built node_modules — without this, a host
      # macOS/Windows node_modules would clobber the Linux binaries.
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules: