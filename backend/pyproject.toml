[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "face-detect-stream-backend"
version = "0.1.0"
description = "Real-time face detection backend: WebSocket frame ingest, MediaPipe detection, ROI persistence."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # ---- web ----
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "websockets>=12,<14",

    # ---- config / validation ----
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",

    # ---- vision (no opencv-python) ----
    "mediapipe>=0.10.18,<0.11",
    "Pillow>=10.4,<12",
    "numpy>=1.26,<2.0",

    # ---- db (Day 2) ----
    "SQLAlchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<1.15",

    # ---- rate limiting (Day 3) ----
    "slowapi>=0.1.9,<0.2",

    # ---- logging ----
    "loguru>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<0.8",
    "black>=24.4,<26",
    "mypy>=1.10,<2",
]
test = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.29",
    "pytest-cov>=5.0,<6",
    "testcontainers[postgresql]>=4.7,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================================
# ruff — lint
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle, pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]   # FastAPI Depends() in test signatures

# ============================================================================
# black — format
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: requires a running PostgreSQL instance (testcontainers)",
]

# ============================================================================
# mypy
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "alembic/"]

[[tool.mypy.overrides]]
module = ["mediapipe.*"]
ignore_missing_imports = true